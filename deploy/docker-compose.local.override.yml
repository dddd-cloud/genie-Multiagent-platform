# Shared local-development adjustments. This file contains no secrets.
# Use together with docker-compose.mvp.yml and a private root .env file.
#
# Phase2 Stage 2: set in root .env before up/build:
#   VITE_PHASE2_ENABLED=true
#   GENIE_MCP_CREDENTIAL_KEY=<32-byte base64>
#   GENIE_INTERNAL_MCP_TOKEN=<token>
# Compose keeps :- defaults so Stage 1 MVP is not blocked.

services:
  genie-backend:
    # Fast local loop: incremental `mvn compile` + existing unpacked libs.
    # Full `package` (the ~10min Windows bind-mount copy) only runs when lib/ is
    # missing, or when GENIE_BACKEND_REPACKAGE=1 (after pom.xml dependency changes).
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        if [ ! -d target/genie-backend/lib ] || [ "$${GENIE_BACKEND_REPACKAGE:-}" = "1" ]; then
          echo "genie-backend: full package (runtime libs missing or GENIE_BACKEND_REPACKAGE=1)"
          mvn -Dmaven.test.skip=true -Djacoco.skip=true -s aliyun-settings.xml package
        else
          echo "genie-backend: fast compile, reusing target/genie-backend/lib"
          mvn -Dmaven.test.skip=true -Djacoco.skip=true -s aliyun-settings.xml compile
        fi
        exec java \
          -classpath "target/classes:target/genie-backend/conf/:target/genie-backend/lib/*" \
          -Dbasedir=target/genie-backend \
          -Dfile.encoding=UTF-8 \
          com.jd.genie.GenieApplication
    healthcheck:
      start_period: 90s
    environment:
      # Avoid initializing the optional Data Agent catalogue during the MVP stack startup.
      AUTOBOTS_DATA_AGENT_STARTUP_INIT_ENABLED: "false"
      # MySQL Connector/J accepts UTF-8 here; the database itself remains utf8mb4.
      GENIE_DB_URL: jdbc:mysql://mysql:3306/genie?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      GENIE_MCP_CREDENTIAL_KEY: ${GENIE_MCP_CREDENTIAL_KEY:-}
      GENIE_INTERNAL_MCP_TOKEN: ${GENIE_INTERNAL_MCP_TOKEN:-}
      # Real-model chat: application.yml interpolates these into llm.settings.
      # Without them, Ensemble fails immediately with "LLM settings incomplete".
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTOBOTS_AUTOAGENT_PLANNER_MODEL_NAME: ${DEFAULT_MODEL:-}
      AUTOBOTS_AUTOAGENT_REACT_MODEL_NAME: ${DEFAULT_MODEL:-}
      AUTOBOTS_AUTOAGENT_EXECUTOR_MODEL_NAME: ${DEFAULT_MODEL:-}
      # Internal dependencies resolve through Compose DNS, not a shared localhost namespace.
      AUTOBOTS_AUTOAGENT_CODE_INTERPRETER_URL: http://genie-tool:1601
      AUTOBOTS_AUTOAGENT_DEEP_SEARCH_URL: http://genie-tool:1601
      AUTOBOTS_AUTOAGENT_KNOWLEDGE_URL: http://genie-tool:1601
      AUTOBOTS_AUTOAGENT_DATA_ANALYSIS_URL: http://genie-tool:1601
      AUTOBOTS_AUTOAGENT_MCP_CLIENT_URL: http://genie-client:8188
      GENIE_MEMORY_DIR: /var/lib/joyagent/memory

  genie-tool:
    ports:
      - "1601:1601"
    volumes:
      - mvp_tool_venv:/workspace/genie-tool/.venv
    environment:
      USE_JD_SEARCH_GATEWAY: ${USE_JD_SEARCH_GATEWAY:-false}
      USE_SEARCH_ENGINE: ${USE_SEARCH_ENGINE:-serp}
      SERPER_SEARCH_URL: ${SERPER_SEARCH_URL:-https://google.serper.dev/search}
      SERPER_SEARCH_API_KEY: ${SERPER_SEARCH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}

  genie-client:
    volumes:
      - mvp_client_venv:/workspace/genie-client/.venv

  ui:
    environment:
      VITE_PHASE2_ENABLED: ${VITE_PHASE2_ENABLED:-false}
      VITE_PYODIDE_INDEX_URL: ${VITE_PYODIDE_INDEX_URL:-/pyodide/}
      FILE_TOOL_BASE_URL: http://genie-tool:1601
    volumes:
      - ../docs:/workspace/docs:ro
      # Keep package-manager writes off the Windows source bind mount.
      - mvp_ui_node_modules:/workspace/ui/node_modules

volumes:
  mvp_ui_node_modules:
  mvp_tool_venv:
  mvp_client_venv:
