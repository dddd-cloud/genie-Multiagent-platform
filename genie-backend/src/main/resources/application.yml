st":"Retry only if a limited and reasonable change may help. Do not repeat the same failed call indefinitely."},"observation_user":{"pre":"","post":"Extract task-relevant facts from the tool result without fabricating anything."},"observation_assistant":{"pre":"","post":""},"critic_user":{"pre":"","post":"Check whether the user task can now be answered completely. If not, identify the next necessary action without exposing internal reasoning."},"critic_assistant":{"pre":"","post":""}}'
